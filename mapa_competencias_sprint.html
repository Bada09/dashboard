<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mapa de Competências · Fairmont Sprint Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f8f9fb; --border: #e3e6eb; --grid: #eef0f3;
  --text: #0f1b2d; --text-2: #4b5565; --text-3: #7a8494;
  --navy: #041e42; --accent: #0a74c9; --accent-soft: #e6f1fb;
  --good: #0f7b3f; --good-soft: #e3f4ea; --warn: #a3520a; --warn-soft: #fdf0e1; --bad: #b42323; --bad-soft: #fbe7e7;
  --h-0: #b42d2c; --h-1: #e0605e; --h-2: #f3b7b3; --h-3: #b9b7af; --h-4: #a9cbf2; --h-5: #3f8ae0; --h-6: #1c5cab; --h-na: #f2f3f5;
  --shadow: 0 1px 2px rgba(15,27,45,.05), 0 2px 8px rgba(15,27,45,.04);
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1d222a; --border: #2a313b; --grid: #232932;
    --text: #eef1f5; --text-2: #b7bfcb; --text-3: #8791a0;
    --navy: #cfe3ff; --accent: #5aa6f0; --accent-soft: #1b2b40;
    --good: #5fcf8e; --good-soft: #15291f; --warn: #f0a55c; --warn-soft: #2e2214; --bad: #f08a8a; --bad-soft: #2e1717;
    --h-3: #6d6c66; --h-na: #20252d;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1d222a; --border: #2a313b; --grid: #232932;
  --text: #eef1f5; --text-2: #b7bfcb; --text-3: #8791a0;
  --navy: #cfe3ff; --accent: #5aa6f0; --accent-soft: #1b2b40;
  --good: #5fcf8e; --good-soft: #15291f; --warn: #f0a55c; --warn-soft: #2e2214; --bad: #f08a8a; --bad-soft: #2e1717;
  --h-3: #6d6c66; --h-na: #20252d; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { letter-spacing: -0.015em; color: var(--text); }
button { font: inherit; color: inherit; }

header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0 12px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; font-weight: 750; }
.brand p { font-size: 12.5px; color: var(--text-3); }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab:hover { color: var(--text); }
.tools { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }

main { padding: 24px 0 64px; }
section.block { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 17px; font-weight: 700; }
.sec-h .hint { font-size: 12.5px; color: var(--text-3); max-width: 640px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 18px 20px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi .l { font-size: 12px; color: var(--text-3); font-weight: 500; }
.kpi .v { font-size: 28px; font-weight: 750; line-height: 1.15; margin-top: 2px; }
.kpi .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.delta { font-weight: 700; font-size: 12.5px; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px; }
.delta.up { color: var(--good); background: var(--good-soft); }
.delta.down { color: var(--bad); background: var(--bad-soft); }
.delta.flat { color: var(--text-3); background: var(--surface-2); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }

/* Overview company card */
.co-card { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.co-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.co-head h2 { font-size: 22px; font-weight: 750; }
.co-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.co-kpis .v { font-size: 22px; font-weight: 750; }
.co-kpis .l { font-size: 11.5px; color: var(--text-3); }
.co-list { display: grid; gap: 6px; }
.co-list li { list-style: none; display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
.co-list .n { font-weight: 800; color: var(--accent); min-width: 14px; }
.empty-state { border: 1.5px dashed var(--border); border-radius: var(--r); padding: 22px; color: var(--text-2); background: var(--surface-2); }
.empty-state code { background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }

/* Attack line */
.prio { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.prio .rank { position: absolute; top: 16px; right: 18px; font-size: 30px; font-weight: 800; color: var(--grid); line-height: 1; }
.prio h3 { font-size: 16px; font-weight: 700; padding-right: 34px; }
.prio .big { font-size: 13px; color: var(--text-2); }
.prio .big b { color: var(--warn); font-size: 15px; }
.prio .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--text-2); }
.prio .acao { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--text); }
.prio .acao b { color: var(--accent); }
.quote { font-size: 12.5px; color: var(--text-2); border-left: 3px solid var(--border); padding: 2px 0 2px 10px; font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* Evolution */
.evo-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
.evo-item:first-child { border-top: 0; padding-top: 2px; }
.evo-bar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); white-space: nowrap; }

/* Area cards */
.area { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.area-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.area-h h3 { font-size: 16px; font-weight: 700; }
.area-h .sc { font-size: 22px; font-weight: 750; }
.area .meta { font-size: 12.5px; color: var(--text-3); display: flex; gap: 12px; flex-wrap: wrap; }

/* Heatmap */
.hm-controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.hm-wrap { overflow-x: auto; }
table.hm { border-collapse: separate; border-spacing: 2px; min-width: 100%; }
table.hm th { font-size: 11px; font-weight: 600; color: var(--text-2); padding: 6px 3px; vertical-align: bottom; text-align: center; width: 90px; min-width: 84px; max-width: 96px; line-height: 1.25; white-space: normal; overflow-wrap: break-word; hyphens: manual; }
table.hm th .e { display: block; font-size: 15px; margin-bottom: 2px; }
table.hm th.rowh, table.hm td.rowh { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 180px; max-width: 220px; }
table.hm td.rowh { font-size: 13px; font-weight: 600; padding: 6px 10px 6px 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.hm td.rowh small { display: block; font-weight: 500; color: var(--text-3); font-size: 11.5px; }
table.hm td.c { height: 38px; text-align: center; font-size: 12.5px; font-weight: 700; border-radius: 5px; cursor: default; }
td.c.na { background: var(--h-na); color: var(--text-3); font-weight: 500; background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(127,127,127,.08) 5px 7px); }
.legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-top: 12px; }
.legend .scale { display: flex; gap: 2px; }
.legend .scale span { width: 30px; height: 12px; border-radius: 3px; }

/* People */
.people-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.input { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 13px; min-width: 220px; }
select.input { min-width: 0; }
.person { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; border: 1px solid var(--border); }
.person:hover { border-color: var(--accent); }
.person .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.person .nm { font-weight: 700; font-size: 14.5px; }
.person .sub { font-size: 12px; color: var(--text-3); }
.person .stats { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); }
.person .stats b { font-size: 18px; color: var(--text); }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; font-size: 12.5px; }
.kv span:nth-child(odd) { color: var(--text-3); }
.badge-lead { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #efe9fd; color: #5b3cc4; }

/* Month chart */
.mchart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; border-bottom: 1px solid var(--border); }
.mchart .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.mchart .b i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .85; }
.mchart .b:hover i { opacity: 1; }
.mchart .b em { font-style: normal; font-size: 11px; color: var(--text-3); margin-bottom: 3px; }
.mlabels { display: flex; gap: 6px; font-size: 10.5px; color: var(--text-3); margin-top: 4px; }
.mlabels span { flex: 1; text-align: center; }

/* Drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(8,14,24,.45); display: none; z-index: 60; }
.drawer-bg.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(620px, 100%); background: var(--surface); z-index: 61; transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; border-left: 1px solid var(--border); }
.drawer.open { transform: none; }
.drawer .dh { position: sticky; top: 0; background: var(--surface); padding: 18px 22px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; z-index: 2; }
.drawer .dh h2 { font-size: 20px; }
.drawer .db { padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 22px; }
.sbar { display: grid; grid-template-columns: minmax(0, 1fr) 150px 44px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
.sbar .track { height: 10px; background: var(--grid); border-radius: 5px; position: relative; }
.sbar .track b.mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; }
.bars-card { display: flex; flex-direction: column; gap: 2px; }
.bars-card .sbar { grid-template-columns: minmax(0, 1fr) 110px 44px; font-size: 12.5px; padding: 4px 0; }
.bc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.bc-t { font-weight: 700; font-size: 15px; }
.bc-h[data-person]:hover .bc-t { color: var(--accent); }
.sbar .track i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; }
.sbar .val { text-align: right; font-weight: 700; font-size: 12.5px; }
.sbar.na { color: var(--text-3); }
.x { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; }

.radar { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.radar .rd-lbl { font-size: 11.5px; fill: var(--text-2); font-weight: 600; }
.radar .rd-lbl.sm { font-size: 12.5px; }
.radar .rd-tick { font-size: 10px; fill: var(--text-3); }
.radar-ctrl { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.radar-ctrl select { min-width: 260px; }
.radar-box { display: flex; flex-direction: column; align-items: center; }
.rd-leg { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.rd-leg span { display: inline-flex; align-items: center; gap: 6px; }
.co-radar .radar { max-width: 380px; }
.radar-empty { padding: 24px; text-align: center; }
.g-concepts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.g-concepts p, .g-step p, .g-step li, .g-list li { font-size: 13.5px; color: var(--text-2); }
.g-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-step { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
.g-step h3 { font-size: 15px; margin-bottom: 6px; }
.g-step p + p, .g-step ul { margin-top: 6px; }
.g-step ul, .g-list { padding-left: 18px; display: grid; gap: 5px; }
.g-n { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; display: grid; place-items: center; }
.g-ex { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; display: grid; gap: 3px; }
.g-ex p { font-size: 13px; color: var(--text); margin: 0 !important; }
@media (max-width: 1000px) { .g-concepts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .g-concepts, .g-steps { grid-template-columns: minmax(0, 1fr); } }
details.method { margin-top: 32px; }
details.method summary { cursor: pointer; font-weight: 600; color: var(--text-2); }
details.method div { margin-top: 10px; font-size: 13px; color: var(--text-2); display: grid; gap: 8px; max-width: 860px; }

/* Filtros da planilha */
.fbar { position: sticky; top: 0; z-index: 25; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.fbar-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.fbar .fld { display: flex; flex-direction: column; gap: 4px; }
.fbar .fld .lbl { margin: 0; }
.fbar .fld select { min-width: 170px; }
.fbar .fld.q .input { min-width: 230px; }
.fbar .fld.on .input { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fbar-sum { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-2); }
.fbar-sum b { color: var(--text); }
.who { font-size: 12px; color: var(--text-3); }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
/* Mapa geográfico */
.geo { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; overflow: hidden; }
#geoMap { background: var(--surface-2); display: flex; justify-content: center; align-items: center; padding: 10px; min-height: 440px; }
#geoMap svg { width: 100%; max-width: 640px; height: auto; max-height: 520px; display: block; }
.geo-br { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-linejoin: round; }
.geo-outros { fill: var(--surface); stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
.geo-mar { fill: var(--surface-2); }
.geo-pt { cursor: pointer; stroke: var(--surface); stroke-width: 2.5; transition: opacity .15s; }
.geo-pt:hover { opacity: .85; }
.geo-pt.sel { stroke: var(--navy); stroke-width: 4; }
.geo-ring { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; pointer-events: none; }
.geo-lbl { font-size: 21px; font-weight: 700; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.geo-n { font-size: 18px; font-weight: 800; fill: #fff; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.geo-side { border-left: 1px solid var(--border); padding: 14px 16px; overflow-y: auto; max-height: 540px; display: flex; flex-direction: column; gap: 10px; }
.geo-city { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--surface); text-align: left; width: 100%; }
.geo-city:hover, .geo-city.on { border-color: var(--accent); }
.geo-city.foco { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent); }
.geo-city .t { display: flex; justify-content: space-between; font-weight: 700; font-size: 13.5px; }
.geo-city .m { font-size: 12px; color: var(--text-3); }
.geo-det { border: 1px solid var(--accent); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.geo-det h4 { font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.geo-det .r { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--grid); align-items: center; font-size: 12.5px; }
.geo-det .r span:last-child { color: var(--text-3); text-align: right; }
.geo-det .r button { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; text-align: left; font: inherit; font-weight: 700; }
.geo-det .r.off { color: var(--text-3); }
.geo-det .acts { display: flex; gap: 8px; margin-top: 8px; }
.geo-det .acts .btn { flex: 1; }
.geo-leg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-3); padding: 6px 2px 0; }
@media (max-width: 900px) { .geo { grid-template-columns: minmax(0, 1fr); } .geo-side { border-left: 0; border-top: 1px solid var(--border); max-height: none; } #geoMap { min-height: 0; } }
@media (max-width: 720px) { .fbar { position: static; } .fbar .fld, .fbar .fld select, .fbar .fld.q .input { width: 100%; min-width: 0; } }
@media print { .fbar { position: static; } }
#tip { position: fixed; pointer-events: none; z-index: 90; background: #0f1b2d; color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 8px; max-width: 280px; opacity: 0; transition: opacity .08s; line-height: 1.4; }

@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
  .co-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tabs { width: 100%; overflow-x: auto; }
  .kpi .v { font-size: 24px; }
  .sbar { grid-template-columns: minmax(0, 1fr) 90px 40px; }
  .input { min-width: 0; width: 100%; }
  header.top { position: static; }
}
@media print {
  header.top { position: static; } .tools, .drawer-bg, .drawer { display: none !important; }
  body { background: #fff; } .card { box-shadow: none; break-inside: avoid; }
}
/* ═══════════ Tema Fairmont × rhapsody ═══════════
   Fairmont: grafite #1b1f24, dourado #b08d57, azul #009ecc
   rhapsody: gradiente violeta → azul → rosa (#8B5CF6 · #3B82F6 · #EC4899) */
:root {
  --bg: #f2f5f9; --surface: #ffffff; --surface-2: #f6f9fc; --border: #e0e7f0; --grid: #edf2f7;
  --text: #0b1f3a; --text-2: #3f5068; --text-3: #6a7a90;
  --navy: #1b1f24; --accent: #009ecc; --accent-2: #04708f; --accent-soft: #e2f4fa;
  --ml-green: #a4ce4e; --good: #3d7a10; --good-soft: #eef7e2; --warn: #b45309; --warn-soft: #fdf1e3; --bad: #c02b2b; --bad-soft: #fdeaea;
  --rh-1: #8b5cf6; --rh-2: #3b82f6; --rh-3: #ec4899;
  --rh-grad: linear-gradient(90deg, var(--rh-1), var(--rh-2), var(--rh-3));
  --h-0: #c0392b; --h-1: #e2665e; --h-2: #f4b7ae; --h-3: #b8bec8; --h-4: #9fd4f3; --h-5: #0090da; --h-6: #0061a0; --h-na: #eef2f6;
  --shadow: 0 1px 2px rgba(4,30,66,.05), 0 6px 20px rgba(4,30,66,.06);
  --shadow-h: 0 2px 4px rgba(4,30,66,.06), 0 14px 32px rgba(4,30,66,.10);
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111c; --surface: #111a27; --surface-2: #162132; --border: #243246; --grid: #1c2839;
    --text: #eaf1fa; --text-2: #b4c2d4; --text-3: #8596ad;
    --navy: #cfe6ff; --accent: #3db2f0; --accent-2: #7cc8f5; --accent-soft: #10304a;
    --good: #9fd26a; --good-soft: #1a2c14; --warn: #f3a85c; --warn-soft: #2f2213; --bad: #f28b8b; --bad-soft: #321919;
    --h-3: #5f6b7c; --h-4: #2f6f99; --h-na: #1a2433; --shadow: none; --shadow-h: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111c; --surface: #111a27; --surface-2: #162132; --border: #243246; --grid: #1c2839;
  --text: #eaf1fa; --text-2: #b4c2d4; --text-3: #8596ad;
  --navy: #cfe6ff; --accent: #3db2f0; --accent-2: #7cc8f5; --accent-soft: #10304a;
  --good: #9fd26a; --good-soft: #1a2c14; --warn: #f3a85c; --warn-soft: #2f2213; --bad: #f28b8b; --bad-soft: #321919;
  --h-3: #5f6b7c; --h-4: #2f6f99; --h-na: #1a2433; --shadow: none; --shadow-h: none;
}
body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; letter-spacing: -0.005em; }
.num { font-variant-numeric: tabular-nums; }

/* Cabeçalho */
header.top { background: #1b1f24; border-bottom: 0; color: #fff; }
header.top::after { content: ""; display: block; height: 3px; background: var(--rh-grad); }
.top-row { padding: 18px 0 10px; }
.marks { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 800; font-size: 13px; letter-spacing: .01em; }
.mk-met { background: #b08d57; color: #fff; padding: 2px 10px; border-radius: 6px; letter-spacing: .12em; text-transform: uppercase; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
.mk-met::after { content: none; }
.mk-x { color: rgba(255,255,255,.45); font-weight: 500; }
.mk-rh { background: var(--rh-grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 15px; }
.brand h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
.brand p { color: rgba(255,255,255,.62); font-size: 12.5px; }
header.top .btn { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.22); color: #fff; }
header.top .btn:hover { background: rgba(255,255,255,.14); border-color: #fff; color: #fff; }
.tabs { gap: 2px; }
.tab { color: rgba(255,255,255,.62); padding: 10px 16px; border-bottom: 3px solid transparent; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: transparent; border-image: var(--rh-grad) 1; }

/* Tipografia e seções */
main { padding: 22px 0 72px; }
section.block { margin-top: 36px; }
.sec-h h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.015em; display: flex; align-items: center; gap: 10px; }
.sec-h h2::before { content: ""; width: 5px; height: 20px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--rh-1)); flex: none; }
.sec-h .hint { font-size: 13px; }
.lbl { color: var(--text-3); letter-spacing: .07em; }

/* Cartões */
.card { border-radius: var(--r); border-color: var(--border); box-shadow: var(--shadow); }
button.card:hover, .person:hover, .exec-card:hover { box-shadow: var(--shadow-h); }
.btn { border-radius: 10px; font-weight: 600; transition: border-color .15s, color .15s, background .15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-left: 0; }
.btn.ghost:hover { text-decoration: underline; }
.input { border-radius: 10px; border-color: var(--border); background: var(--surface); }
.input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.pill { border-radius: 999px; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip { border-radius: 999px; }
.tag { background: linear-gradient(90deg, rgba(139,92,246,.14), rgba(0,144,218,.14)); color: var(--accent-2); }

/* KPIs com faixa de cor */
.g4 > .kpi { position: relative; overflow: hidden; }
.g4 > .kpi::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--accent); }
.g4 > .kpi:nth-child(2)::before { background: var(--ml-green); }
.g4 > .kpi:nth-child(3)::before { background: var(--accent-2); }
.g4 > .kpi:nth-child(4)::before { background: var(--rh-grad); }
.kpi .v { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.mchart .b i { background: linear-gradient(180deg, var(--accent), var(--accent-2)); opacity: 1; }
.prio .rank { color: var(--accent-soft); }
.prio .acao { background: var(--accent-soft); }
.drawer { width: min(720px, 100%); }
.drawer .dh { border-bottom: 0; box-shadow: 0 1px 0 var(--border); }
.drawer .dh::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--rh-grad); }

/* Filtros */
.fbar { top: 0; border-left: 4px solid var(--accent); margin-top: 18px; }
.fbar-toggle { display: none; }

/* Mapa */
#geoMap { position: relative; padding: 0; min-height: 0; background: var(--surface-2); border-radius: var(--r) 0 0 0; overflow: hidden; }
#geoSvgBox { width: 100%; height: min(560px, 72vh); touch-action: pan-y; cursor: default; }
#geoSvgBox svg { width: 100%; height: 100%; max-width: none; max-height: none; display: block; user-select: none; -webkit-user-select: none; }
#geoSvgBox svg.zoomed { cursor: grab; touch-action: none; }
#geoSvgBox:has(svg.zoomed) { touch-action: none; }
.geo-mar { fill: var(--surface-2); }
.geo-br { fill: var(--accent-soft); stroke: var(--accent); }
.geo-ctrl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-h); border: 1px solid var(--border); }
.geo-ctrl button { width: 38px; height: 38px; border: 0; border-bottom: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 20px; font-weight: 600; cursor: pointer; line-height: 1; }
.geo-ctrl button:last-child { border-bottom: 0; font-size: 17px; }
.geo-ctrl button:hover { background: var(--accent-soft); color: var(--accent); }
.geo-zoom { position: absolute; right: 12px; top: 136px; font-size: 11px; font-weight: 700; color: var(--text-3); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.geo-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(4,30,66,.88); color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
.geo-hint.show { opacity: 1; }
.geo-pt { stroke: var(--surface); }
.geo-city { border-radius: 12px; }
.geo-det { border-radius: 14px; border-width: 1.5px; }

/* Jornada do hóspede (time) */
.funil-big { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.fb { border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); position: relative; }
.fb.alvo { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.fb-top { display: flex; justify-content: space-between; align-items: center; min-height: 20px; }
.fb-i { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-2); font-weight: 800; font-size: 12px; display: grid; place-items: center; }
.fb.alvo .fb-i { background: var(--warn-soft); color: var(--warn); }
.fb.alvo .tag { background: var(--warn-soft); color: var(--warn); }
.fb-n { font-weight: 700; font-size: 13px; line-height: 1.3; min-height: 34px; }
.fb-v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.fb-bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.fb-bar i { display: block; height: 100%; border-radius: 4px; }

/* Resumo executivo */
.exec-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .15s; }
.exec-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; cursor: pointer; }
.exec-h .nm { font-weight: 800; font-size: 16px; }
.exec-h .sub { font-size: 12px; color: var(--text-3); }
.exec-h:hover .nm { color: var(--accent); }
.exec-score { text-align: right; line-height: 1.05; }
.exec-score b { font-size: 26px; font-weight: 800; color: var(--accent-2); }
.exec-score span { display: block; font-size: 11px; color: var(--text-3); }
.exec { display: flex; flex-direction: column; gap: 12px; }
.exec-sint { font-size: 13.5px; color: var(--text); background: var(--surface-2); border-left: 3px solid; border-image: linear-gradient(180deg, var(--accent), var(--rh-1)) 1; padding: 10px 12px; border-radius: 0 10px 10px 0; line-height: 1.5; }
.exec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.exec-b { border: 1px solid var(--grid); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.exec-b .pills { gap: 5px; }
.exec-b .pill { white-space: normal; }
.freq-row { display: flex; gap: 10px; align-items: center; font-size: 12.5px; line-height: 1.3; }
.freq-row .big { font-size: 28px; font-weight: 800; color: var(--accent); }
.exec-l { list-style: none; display: grid; gap: 5px; font-size: 12.5px; }
.exec-l li { padding-left: 12px; position: relative; }
.exec-l li::before { content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.exec-fase { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; align-items: start; border: 1px solid var(--warn-soft); background: linear-gradient(90deg, var(--warn-soft), transparent 70%); border-radius: 12px; padding: 12px; }
.fase-alvo { font-weight: 800; font-size: 15px; color: var(--warn); margin: 3px 0 4px; }
.funil { display: grid; gap: 4px; }
.fz { display: grid; grid-template-columns: 18px 84px minmax(0, 1fr) 36px; gap: 6px; align-items: center; font-size: 11.5px; padding: 2px 4px; border-radius: 6px; }
.fz.alvo { background: var(--surface); box-shadow: 0 0 0 1.5px var(--warn); }
.fz-n { width: 16px; height: 16px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-2); font-weight: 800; font-size: 10px; display: grid; place-items: center; }
.fz-t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fz-bar { height: 7px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.fz-bar i { display: block; height: 100%; border-radius: 4px; }
.fz-v { text-align: right; font-weight: 700; }
.fz.na { color: var(--text-3); }
.exec.full .exec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.fb-v { color: var(--text); }
.fb.alvo .fb-v { color: var(--warn); }
.fb.na .fb-v { color: var(--text-3); }
.freq-kv { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); }
.freq-kv b { color: var(--text); }
/* Gráfico mensal */
.mc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.mc-kpi { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.mc-kpi b { font-size: 16px; }
.mc-wrap { overflow-x: auto; }
.mc-svg { width: 100%; height: auto; display: block; }
.mc-grid { stroke: var(--grid); stroke-width: 1; }
.mc-ax { font-size: 11px; fill: var(--text-3); }
.mc-ax.mc-off { fill: var(--text-3); opacity: .6; }
.mc-bar { fill: var(--accent); fill-opacity: .22; }
.mc-vazio { fill: var(--h-na); stroke: var(--border); stroke-dasharray: 4 4; }
.mc-vz { font-size: 14px; fill: var(--text-3); }
.mc-linha { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.mc-pt { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.mc-val { font-size: 12.5px; font-weight: 800; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.mc-tend { stroke: var(--rh-1); stroke-width: 2; stroke-dasharray: 6 5; }
.mc-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--text-3); margin-top: 8px; }
.mc-leg span { display: inline-flex; align-items: center; gap: 6px; }
.mc-leg i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; }
.lg-bar { background: var(--accent); opacity: .3; }
.lg-linha { height: 3px !important; background: var(--accent); }
.lg-tend { height: 0 !important; border-top: 2px dashed var(--rh-1); }
.lg-vazio { background: var(--h-na); border: 1px dashed var(--border); }
/* ═══ Responsivo ═══ */
@media (max-width: 1100px) {
  .funil-big { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .exec-list { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .geo { grid-template-columns: minmax(0, 1fr); }
  #geoMap { border-radius: var(--r) var(--r) 0 0; }
  #geoSvgBox { height: min(460px, 62vh); }
  .geo-side { border-left: 0; border-top: 1px solid var(--border); max-height: none; }
  .exec-fase { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .wrap { padding: 0 14px; }
  .top-row { padding: 14px 0 6px; gap: 10px; }
  .brand h1 { font-size: 20px; }
  .tools { width: 100%; }
  .tools .btn { flex: 1; padding: 7px 8px; font-size: 12.5px; }
  .tab { padding: 10px 12px; }
  section.block { margin-top: 28px; }
  .sec-h h2 { font-size: 17px; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px; }
  .kpi.pad { padding: 14px; }
  .kpi .v { font-size: 22px; }
  .kpi .s { font-size: 11px; }
  .fbar { position: sticky; top: 0; padding: 10px 12px; gap: 8px; }
  .fbar-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; font-weight: 700; font-size: 14px; color: var(--text); cursor: pointer; padding: 2px 0; }
  .fbar-toggle .car { transition: transform .2s; }
  .fbar.open .fbar-toggle .car { transform: rotate(180deg); }
  .fbar .fbar-row { display: none; }
  .fbar.open .fbar-row { display: flex; }
  .fbar-sum { font-size: 12px; }
  .funil-big { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .fb { padding: 10px; }
  .fb-v { font-size: 22px; }
  .exec-grid, .exec.full .exec-grid { grid-template-columns: minmax(0, 1fr); }
  .exec-card { padding: 14px; }
  .fz { grid-template-columns: 18px 76px minmax(0, 1fr) 34px; }
  .geo-ctrl button { width: 42px; height: 42px; }
  .geo-zoom { top: 150px; }
  .drawer .dh { padding: 16px 16px 10px; }
  .drawer .db { padding: 14px 16px 40px; }
  table.hm td.rowh, table.hm th.rowh { min-width: 130px; }
}
@media print {
  header.top { background: #041e42 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fbar, .geo-ctrl, .geo-zoom, .geo-hint, [data-execall] { display: none !important; }
  .exec-card { break-inside: avoid; }
}
@media (max-width: 720px) {
  .fbar:not(.open) .fbar-sum { display: none; }
  .fbar { margin-top: 12px; }
}
/* ═══ Aba Resultados do piloto ═══ */
.hs { display: flex; flex-direction: column; gap: 18px; }
.hs-hero { position: relative; overflow: hidden; border-radius: 22px; padding: 38px 34px 30px; color: #fff; background:
  radial-gradient(700px 300px at 100% 0%, rgba(236,72,153,.28), transparent 60%),
  radial-gradient(600px 320px at 0% 100%, rgba(0,144,218,.45), transparent 60%), #1b1f24; }
.hs-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--rh-grad); }
.hs-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.hs-hero .hs-titulo, .hs-cta .hs-cta-h { color: #fff; -webkit-text-fill-color: #fff; }
.hs-titulo { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; margin: 10px 0 12px; max-width: 18ch; text-wrap: balance; }
.hs-hero .hs-titulo em { -webkit-text-fill-color: transparent; }
.hs-titulo em { font-style: normal; background: linear-gradient(90deg, #7dd3fc, #c4b5fd, #f9a8d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hs-lead { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.82); max-width: 62ch; }
.hs-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
.hs-kpis > div { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.hs-kpis b { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.hs-kpis span { font-size: 12.5px; color: rgba(255,255,255,.72); }
.hs-cap { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px 24px 24px 18px; box-shadow: var(--shadow); }
.hs-cap-n { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(180deg, var(--accent), var(--rh-1)); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; line-height: 1; padding-top: 2px; }
.hs-cap-b { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hs-h { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); text-wrap: balance; }
.hs-p { font-size: 14.5px; line-height: 1.6; color: var(--text-2); max-width: 70ch; }
.hs-p b { color: var(--text); }
.hs-nota { font-size: 13.5px; color: var(--text-2); background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; }
.hs-nota b { color: var(--text); }
.hs-fonte { font-size: 11.5px; color: var(--text-3); }
.hs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hs-chip { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); }
.hs-chip.eq { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.hs-chart { background: var(--surface-2); border-radius: 14px; padding: 8px 10px; }
.hs-svg { width: 100%; height: auto; max-height: 260px; display: block; }
.hs-linha { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
.hs-pt { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.hs-pt.fim { fill: var(--accent); stroke: var(--surface); }

.vz-kpis b { font-size: 26px; font-weight: 800; color: var(--good); letter-spacing: -0.02em; }
.vz-kpis span { font-size: 12.5px; color: var(--text-2); line-height: 1.35; }
.vz-dest { margin: 0; border-radius: 18px; padding: 22px 24px; background: linear-gradient(135deg, #1b1f24, #2c323a); color: #fff; position: relative; overflow: hidden; }
.vz-dest::before { content: "“"; position: absolute; right: 18px; top: -30px; font-size: 160px; font-weight: 800; line-height: 1; opacity: .12; }
.vz-dest blockquote { margin: 0; font-size: clamp(17px, 2.2vw, 22px); font-weight: 700; line-height: 1.45; color: #fff; text-wrap: pretty; }
.vz-dest figcaption { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,.75); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vz-dest figcaption b { color: #fff; }
.vz-dest .vz-tag { background: rgba(255,255,255,.14); color: #fff; }
.vz-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 800px) { .vz-grid3 { grid-template-columns: minmax(0, 1fr); } }
.vz-q { break-inside: avoid; margin: 0; border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 0 14px 14px 0; padding: 14px; background: var(--surface); }
.vz-q blockquote { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--text); }
.vz-q figcaption { margin-top: 8px; font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vz-q figcaption b { color: var(--text-2); }
.vz-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); }
@media (max-width: 700px) { .vz-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hs-titulo-xl { font-size: clamp(32px, 5vw, 58px); max-width: 24ch; line-height: 1.04; }
.hs-lead-forte { font-size: clamp(16px, 1.8vw, 19px); color: #fff; margin-bottom: 8px; }
.hs-lead-forte b { color: #c9a86a; }

.hs-tab { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }

.hs-tab td { padding: 9px 8px; border-bottom: 1px solid var(--grid); color: var(--text-2); vertical-align: top; }

  // ── Mapa geográfico ─────────────────────────────────────────────────────
  function geoCidades(e) {
    const porCidade = {};
    e.planilha.forEach(r => {
      const c = porCidade[r.cidade] = porCidade[r.cidade] || { cidade: r.cidade, itens: [] };
      const p = r.nomeMapa ? e.pessoas.find(x => x.nome === r.nomeMapa) : null;
      c.itens.push({ nome: p ? p.nome : r.nome, equipe: r.equipe, email: r.email, p, runs: r.runs || 0 });
    });
    return Object.values(porCidade).map(c => {
      const vis = c.itens.filter(i => i.p ? passa(i.p) : passa({ nome: i.nome, email: i.email, cidade: c.cidade, equipe: i.equipe, n: 0 }));
      const comDados = vis.filter(i => i.p);
      const pesos = comDados.reduce((a, i) => a + i.p.n, 0);
      return { ...c, vis, comDados, sessoes: pesos, nota: pesos ? comDados.reduce((a, i) => a + (i.p.score || 0) * i.p.n, 0) / pesos : null };
    }).sort((a, b) => b.itens.length - a.itens.length);
  }
